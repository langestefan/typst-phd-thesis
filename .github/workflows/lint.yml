name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Typst formatting. Pinned so a typstyle release can't change the
      # expected formatting under us; bump deliberately and reformat.
      - name: Install typstyle
        uses: cargo-bins/cargo-binstall@main
      - name: typstyle
        run: |
          cargo binstall -y typstyle@0.15.1
          typstyle --check src tests template examples

      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: shellcheck scripts/*.sh
